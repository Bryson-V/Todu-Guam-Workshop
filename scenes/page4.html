<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OneCare Guam - Wellness Tips</title>
    <link rel="stylesheet" href="../styles/style.css">
    <link rel="stylesheet" href="../styles/page4.css">
    <link rel="stylesheet" href="../styles/navbar.css">
</head>
<body>

<div id="navbarHolder"></div>

<div class="header">
  <h1>Healthy Habits</h1> 
</div>

<p class="intro-text">
  Maintain a healthy lifestyle by exploring our wellness categories below. 
  <br>Good daily habits help prevent illness, improve overall well-being, and support a longer, healthier life.
</p>

<!-- FILTER BUTTONS -->
<div class="filter-container">
  <button class="filter-btn active" data-filter="all">All Tips</button>
  <button class="filter-btn" data-filter="diet">Diet & Nutrition</button>
  <button class="filter-btn" data-filter="exercise">Exercise</button>
  <button class="filter-btn" data-filter="hygiene">Hygiene & Lifestyle</button>
</div>

<!-- CARDS GRID CONTAINER (Populated dynamically via JavaScript) -->
<div class="tips-grid" id="tipsGrid"></div>

<!-- MODAL POPUP STRUCTURE -->
<div id="tipModal" class="modal-overlay">
  <div class="modal-content">
    <button class="modal-close" id="modalClose">&times;</button>
    <div class="modal-body">
      <img id="modalImage" src="" alt="">
      <h2 id="modalTitle"></h2>
      <p id="modalDescription"></p>
      <a id="modalLink" href="#" target="_blank" rel="noopener noreferrer" class="modal-btn">Learn More External Reference</a>
    </div>
  </div>
</div>

<div class="botlogo"> 
  <img src="../assets/Logo2.png" width="280" height="150" alt="OneCare Guam Logo"> 
</div>

<div id="footerHolder"></div>

<script src="../scripts/navbar.js"></script>
<script src="../scripts/wellness-filter.js"></script>
<script src="../scripts/footer.js"></script>
</body>
</html>
